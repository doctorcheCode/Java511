<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новая книга</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h2 th:if="${book.id == null}">Добавить книгу</h2>
<h2 th:if="${book.id != null}">Редактировать книгу</h2>

<form th:action="@{/admin/books/save}" method="post" th:object="${book}">
    <input type="hidden" th:field="*{id}" th:if="${book.id != null}"/>
    <br>
    <label for="title">Название:</label>
    <input type="text" id="title" th:field="*{title}" required>
    <br>
    <label for="author">Автор:</label>
    <input type="text" id="author" th:field="*{author}" required>
    <br>
    <label for="publisher">Издательство:</label>
    <input type="text" id="publisher" th:field="*{publisher}" required>
    <br>
    <label for="publicationYear">Год издания:</label>
    <input type="number" id="publicationYear" th:field="*{publicationYear}" required>
    <br>
    <label for="genre">Жанр:</label>
    <input type="text" id="genre" th:field="*{genre}" required>
    <br>
    <label for="description">Описание:</label>
    <textarea id="description" th:field="*{description}" rows="4" required></textarea>
    <br>
    <button type="submit">Сохранить</button>
    <a th:href="@{/catalog}">Отмена</a>
</form>
</body>
</html>
